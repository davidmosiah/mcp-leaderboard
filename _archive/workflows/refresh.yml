name: Refresh leaderboard
on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Cap the number of servers scored (blank = whole corpus)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build corpus
        run: npm run corpus
      - name: Score corpus
        run: node scripts/run-leaderboard.mjs ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}
        env:
          CONCURRENCY: "12"
          TARGET_TIMEOUT_MS: "60000"
          RUN_BUDGET_MS: "9900000" # 165 min — publish what we have instead of dying at the 180-min job cap
      - name: Render
        run: npm run render
      - name: Render site
        run: npm run render:site
      - name: Upload refreshed leaderboard
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-leaderboard
          path: |
            LEADERBOARD.md
            data/corpus.json
            data/leaderboard.json
            site/index.html
            site/leaderboard.json
            site/sitemap.xml
          if-no-files-found: error

  commit:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download refreshed leaderboard
        uses: actions/download-artifact@v4
        with:
          name: refreshed-leaderboard
          path: .
      - name: Commit refreshed leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LEADERBOARD.md data/corpus.json data/leaderboard.json site/index.html site/leaderboard.json site/sitemap.xml
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh leaderboard $(date -u +%Y-%m-%d)"
            # the sweep takes minutes — main may have moved since this job's checkout
            git pull --rebase origin main
            git push
          fi
